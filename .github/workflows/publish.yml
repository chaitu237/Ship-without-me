name: Publish

# Publishes to npm when a release is created.
#
# Authenticates by OIDC trusted publishing: npm verifies this workflow's identity directly
# from GitHub's token service, so there is no NPM_TOKEN to create, store, or rotate, and no
# long-lived credential that can leak. Enable it once at
# npmjs.com → the package → Settings → Trusted publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Never publish something that does not pass its own checks.
      - name: Verify before publishing
        run: |
          node --check cli/detect.mjs
          node scripts/check-skills.mjs
          node scripts/test-detector.mjs
          node scripts/sync-adapters.mjs --check
          node scripts/run-evals.mjs validate

      - name: Refuse if the release tag and package version disagree
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json is $PKG but the tag is $TAG"
            exit 1
          fi
          echo "version $PKG matches tag $TAG"

      - name: Confirm the tarball contents
        run: npm pack --dry-run

      # OIDC trusted publishing needs npm 11.5.1 or newer
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public
