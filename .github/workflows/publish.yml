name: Publish

# Publishes to npm when a release is created.
#
# Authentication is OIDC trusted publishing. A token path exists but must be asked for
# explicitly, by dispatching with `credential: token`.
#
# OIDC means npm verifies this workflow's identity directly from GitHub: there is no
# credential to create, store, or rotate, and the published package carries a provenance
# attestation pointing back at the run that built it. Set up once at npmjs.com → the
# package → Settings → Trusted publishing → this repo and this workflow filename.
#
# The token path is a fallback for a fork or a registry without trusted publishing, and it
# needs an NPM_TOKEN secret. Two things about that token, because its failure mode is
# misleading: it must be able to publish without an interactive second factor — an
# Automation token, or a granular token with "bypass 2FA" — and a granular token lacking
# that fails with E403 asking for 2FA no matter what the account's own 2FA setting is.
# A token sitting in a local .env is read by nothing here.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      credential:
        description: Which credential path to use
        type: choice
        default: oidc
        options: [oidc, token]

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Resolved once here rather than in a step-level `if:`, where the secrets and inputs
    # contexts are not dependable.
    #
    # OIDC is the default and a token is opt-in, rather than "token if the secret happens to
    # exist". A leftover secret should not silently become the credential a release uses —
    # that is how you get a release taking an untested path months after someone added it.
    env:
      USE_TOKEN: ${{ inputs.credential == 'token' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # npm 12+ requires >=22; OIDC needs npm 11.5.1+
          registry-url: https://registry.npmjs.org

      # Never publish something that does not pass its own checks.
      - name: Verify before publishing
        run: |
          node --check cli/detect.mjs
          node scripts/check-skills.mjs
          node scripts/test-detector.mjs
          node scripts/sync-adapters.mjs --check
          node scripts/run-evals.mjs validate
          node scripts/gen-registry.mjs --check
          node scripts/plan.mjs --test

      - name: Refuse if the release tag and package version disagree
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json is $PKG but the tag is $TAG"
            exit 1
          fi
          echo "version $PKG matches tag $TAG"

      - name: Confirm the tarball contents
        run: npm pack --dry-run

      # Only the OIDC path needs a newer npm (11.5.1+). Skip it when publishing with a
      # token: upgrading npm for no reason is a second thing that can break a release.
      - name: Use an npm that supports OIDC
        if: env.USE_TOKEN != 'true'
        run: npm install -g npm@latest

      - name: Say which credential path is in use
        run: |
          if [ "$USE_TOKEN" = "true" ]; then
            echo "publishing with the NPM_TOKEN secret"
          else
            echo "publishing by OIDC trusted publishing (no stored credential)"
          fi

      - name: Publish with the NPM_TOKEN secret
        if: env.USE_TOKEN == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # setup-node writes an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`. With no token
      # in the environment, npm sends that placeholder verbatim as a bearer token and the
      # registry rejects it before OIDC is ever attempted. Point npm at an empty user config
      # so it has no credential to send and falls through to exchanging its OIDC identity.
      - name: Publish by OIDC trusted publishing
        if: env.USE_TOKEN != 'true'
        run: npm publish --access public
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc-oidc
