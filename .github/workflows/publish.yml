name: Publish

# Publishes to npm when a release is created.
#
# Two ways to authenticate. The workflow picks whichever is configured.
#
#   1. OIDC trusted publishing (preferred). npm verifies this workflow's identity directly
#      from GitHub, so there is no credential to create, store, or rotate and nothing
#      long-lived that can leak. Enable once: npmjs.com → package → Settings →
#      Trusted publishing → add this repo and this workflow file.
#
#   2. An NPM_TOKEN repository secret. Simpler to start, but it is a long-lived credential
#      that has to be rotated and can be exfiltrated by anything that runs in CI.
#      Use an Automation token, never a token with more scope than publish.
#
# If the secret is absent, OIDC is used. A token in a local .env is read by nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # The secrets context is not dependable inside a step-level `if:`, so resolve it once
    # here into a plain env value the steps can test.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # npm 12+ requires >=22; OIDC needs npm 11.5.1+
          registry-url: https://registry.npmjs.org

      # Never publish something that does not pass its own checks.
      - name: Verify before publishing
        run: |
          node --check cli/detect.mjs
          node scripts/check-skills.mjs
          node scripts/test-detector.mjs
          node scripts/sync-adapters.mjs --check
          node scripts/run-evals.mjs validate

      - name: Refuse if the release tag and package version disagree
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json is $PKG but the tag is $TAG"
            exit 1
          fi
          echo "version $PKG matches tag $TAG"

      - name: Confirm the tarball contents
        run: npm pack --dry-run

      # Only the OIDC path needs a newer npm (11.5.1+). Skip it when publishing with a
      # token: upgrading npm for no reason is a second thing that can break a release.
      - name: Use an npm that supports OIDC
        if: env.HAS_NPM_TOKEN != 'true'
        run: npm install -g npm@latest

      - name: Say which credential path is in use
        run: |
          if [ "$HAS_NPM_TOKEN" = "true" ]; then
            echo "publishing with the NPM_TOKEN secret"
          else
            echo "publishing by OIDC trusted publishing (no stored credential)"
          fi

      - name: Publish with the NPM_TOKEN secret
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish by OIDC trusted publishing
        if: env.HAS_NPM_TOKEN != 'true'
        run: npm publish --access public
