<!doctype html>
<html lang="en" data-theme="light">

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">

      <div class="brand">
        <div class="brand-mark" aria-hidden="true">FL</div>
        <div><strong>FleetLedger</strong><span>Maintenance Billing</span></div>

      <nav class="nav-list" id="desktop-nav">
        <button class="nav-item" data-route="dashboard"><span aria-hidden="true">▦</span> Dashboard</button>

      <div class="sidebar-footer">

    <section class="workspace">

          <div class="operator" aria-label="Current role">
            <span class="avatar" aria-hidden="true">MB</span>
            <div><strong>Maintenance Billing</strong><span>Internal workspace</span></div>

      <footer class="app-footer">Data stays in this browser in this MVP. <a href="./privacy.html">Privacy & data handling</a></footer>

    <button data-route="bills"><span aria-hidden="true">₹</span><span>Bills</span></button>
    <button data-route="fleet"><span aria-hidden="true">▤</span><span>Fleet</span></button>
    <button data-route="vendors"><span aria-hidden="true">◇</span><span>Vendors</span></button>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="form-announcer" aria-live="assertive"></div>
  <script type="module" src="./app.js"></script>
